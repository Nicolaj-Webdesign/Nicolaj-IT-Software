# Neues Release: git tag v1.0.1 && git push origin v1.0.1
# Reihenfolge: bauen (+ signieren) → Docker-Image (ghcr.io/<org>/<repo>) → GitHub-Release.
# Das Release erscheint erst, wenn das Image fertig ist – so kann der Server (oder Coolify)
# direkt das neue Image holen.
name: Release

on:
  push:
    tags: ['v*']
  # Release ohne git: GitHub › Actions › Release › „Run workflow“ → Version eintragen (geht auch in der GitHub-App)
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, z. B. 1.0.1'
        required: true

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: windows-latest   # wegen der Windows-Code-Signatur; Go baut die Linux-Versionen trotzdem mit
    defaults:
      run:
        shell: bash
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.24'
          cache: false   # keine Fremdpakete (kein go.sum) – nichts zu cachen

      - name: Version (aus dem Tag oder der Eingabe)
        id: ver
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then V="${INPUT_VERSION#v}"; else V="${GITHUB_REF_NAME#v}"; fi
          V="$(echo "$V" | tr -d '[:space:]')"
          if ! echo "$V" | grep -Eq '^[0-9]{1,4}(\.[0-9]{1,4}){1,3}$'; then
            echo "::error::Version „$V“ ist ungültig – bitte z. B. 1.0.1 eingeben."
            exit 1
          fi
          echo "VERSION=$V" >> "$GITHUB_ENV"
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Tests
        run: go test ./agent

      - name: Agent bauen
        run: bash ./build.sh agent

      # ---------- Optional: Code-Signatur mit Microsoft Artifact Signing ----------
      # Einrichten: Repository-Variable SIGNING=azure und die Secrets AZURE_TENANT_ID,
      # AZURE_CLIENT_ID, AZURE_CLIENT_SECRET sowie die Variablen AZURE_SIGNING_ENDPOINT,
      # AZURE_SIGNING_ACCOUNT, AZURE_CERT_PROFILE. (Aktuelle Version der Action prüfen:
      # https://github.com/Azure/artifact-signing-action)
      - name: Agent signieren
        if: ${{ vars.SIGNING == 'azure' }}
        uses: azure/artifact-signing-action@v1
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_CERT_PROFILE }}
          files-folder: ${{ github.workspace }}\dist
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Server bauen (enthält den signierten Agent)
        run: bash ./build.sh server

      - name: Agent zur Seite legen (wird nicht doppelt signiert)
        if: ${{ vars.SIGNING == 'azure' }}
        run: mkdir -p signed && mv dist/nicolaj-agent.exe signed/

      - name: Server (Windows) signieren
        if: ${{ vars.SIGNING == 'azure' }}
        uses: azure/artifact-signing-action@v1
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_CERT_PROFILE }}
          files-folder: ${{ github.workspace }}\dist
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Agent zurücklegen
        if: ${{ vars.SIGNING == 'azure' }}
        run: mv signed/nicolaj-agent.exe dist/

      # ---------- Prüfsummen + Release-Signatur ----------
      - name: Prüfsummen
        run: bash ./build.sh sums

      - name: Prüfsummen signieren (Release-Schlüssel)
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          if [ -n "$RELEASE_SIGNING_KEY" ]; then
            go run ./tools/releasekey sign dist/SHA256SUMS.txt
          else
            echo "::notice::Ohne Release-Signatur (optional, siehe README „Release-Schlüssel“)."
          fi

      - name: Dateien weitergeben
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  # ---------- Docker-Image für Coolify + automatisches Deployment ----------
  docker:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Dateirechte wiederherstellen
        run: chmod +x dist/nicolaj-rmm-server-linux-*

      - name: Image-Name (GHCR braucht Kleinbuchstaben)
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Image bauen und hochladen (amd64 + arm64)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:latest

  # ---------- GitHub-Release (erst wenn das Image fertig ist) ----------
  release:
    needs: [build, docker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: GitHub-Release erstellen (legt bei „Run workflow“ auch den Tag an)
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh release create "v$VERSION" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Nicolaj Fernwartung $VERSION" \
            --generate-notes

      # Nur wenn Coolify aus dem Internet erreichbar ist. Ohne öffentliche IP leer lassen –
      # dann stößt der Server Coolify selbst an (NRMM_COOLIFY_WEBHOOK/NRMM_COOLIFY_TOKEN).
      - name: Coolify neu deployen (optional)
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "$COOLIFY_WEBHOOK" ] || [ -z "$COOLIFY_TOKEN" ]; then
            echo "Kein COOLIFY_WEBHOOK – der Server stößt Coolify selbst an."
            exit 0
          fi
          curl --fail --silent --show-error --request GET "$COOLIFY_WEBHOOK" --header "Authorization: Bearer $COOLIFY_TOKEN"
